apiVersion: apps/v1
kind: Deployment
metadata:
  name: ch-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ch
  template:
    metadata:
      labels:
        app: ch
    spec:
      containers:
      - image: renxuzhan/ch:5
        name: ch-container
        ports:
        - containerPort: 8080
        env:
        - name: ASPNETCORE_ENVIRONMENT
          value: Development
        # Create beforehand (not stored in git):
        # kubectl create secret generic ch-secrets \
        #   --from-literal=connection-string='Host=...;Port=5432;Database=CH;Username=...;Password=...' \
        #   --from-literal=jwt-key='<long random signing key>'
        - name: ConnectionStrings__DefaultConnection
          valueFrom:
            secretKeyRef:
              name: ch-secrets
              key: connection-string
        - name: Jwt__Key
          valueFrom:
            secretKeyRef:
              name: ch-secrets
              key: jwt-key
        # Account key/connection string used to upload and delete media in the stchimages storage account.
        # Add it to the secret: kubectl patch secret ch-secrets -p '{"stringData":{"storage-connection-string":"<connection string>"}}'
        - name: AzureStorage__ConnectionString
          valueFrom:
            secretKeyRef:
              name: ch-secrets
              key: storage-connection-string
        readinessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 20

---
apiVersion: v1
kind: Service
metadata:
  name: ch-service
spec:
  selector:
    app: ch
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8080
  type: LoadBalancer
