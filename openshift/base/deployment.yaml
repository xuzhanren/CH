apiVersion: apps/v1
kind: Deployment
metadata:
  name: canhappy
  labels:
    app: canhappy
  annotations:
    image.openshift.io/triggers: |
      [{"from":{"kind":"ImageStreamTag","name":"canhappy:latest"},"fieldPath":"spec.template.spec.containers[?(@.name==\"canhappy\")].image"}]
spec:
  replicas: 1
  selector:
    matchLabels:
      app: canhappy
  template:
    metadata:
      labels:
        app: canhappy
    spec:
      containers:
        - name: canhappy
          image: canhappy:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: canhappy-env
            - secretRef:
                name: canhappy-secrets
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
